<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus Explorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Modbus Explorer</h1>
            <p class="subtitle">Modbus-Register lesen und schreiben</p>
        </header>

        <!-- Verbindungseinstellungen -->
        <section class="card">
            <h2>Verbindungseinstellungen</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="ip">IP-Adresse</label>
                    <input type="text" id="ip" placeholder="192.168.1.100" required>
                </div>
                <div class="form-group">
                    <label for="port">Port</label>
                    <input type="number" id="port" value="{{ default_port }}" min="1" max="65535">
                </div>
                <div class="form-group">
                    <label for="slave_id">Slave-ID</label>
                    <input type="number" id="slave_id" value="{{ default_slave_id }}" min="0" max="255">
                </div>
            </div>
        </section>

        <!-- Einzelnes Register -->
        <section class="card">
            <h2>Einzelnes Register</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="address">Register-Adresse</label>
                    <input type="number" id="address" value="0" min="0">
                </div>
                <div class="form-group">
                    <label for="register_type">Register-Typ</label>
                    <select id="register_type">
                        <option value="holding">Holding Register (Lesen/Schreiben)</option>
                        <option value="input">Input Register (Nur Lesen)</option>
                        <option value="coil">Coil (Lesen/Schreiben)</option>
                        <option value="discrete">Discrete Input (Nur Lesen)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="data_type">Datentyp</label>
                    <select id="data_type">
                        {% for dt in data_types %}
                        <option value="{{ dt }}" {% if dt == 'uint16' %}selected{% endif %}>{{ dt }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button id="btn-read" class="btn btn-primary">Wert lesen</button>
                <button id="btn-test-write" class="btn btn-secondary">Schreibbar testen</button>
            </div>

            <!-- Ergebnis-Anzeige -->
            <div id="result-container" class="result-container hidden">
                <div class="result-header">
                    <h3>Ergebnis</h3>
                    <span id="writable-badge" class="badge hidden"></span>
                </div>
                <div class="result-grid">
                    <div class="result-item">
                        <label>Aktueller Wert</label>
                        <span id="current-value">-</span>
                    </div>
                    <div class="result-item">
                        <label>Roh-Register</label>
                        <span id="raw-value">-</span>
                    </div>
                </div>

                <!-- Schreiben-Bereich -->
                <div id="write-section" class="write-section hidden">
                    <h4>Neuen Wert schreiben</h4>
                    <div class="write-form">
                        <input type="text" id="new-value" placeholder="Neuen Wert eingeben">
                        <button id="btn-write" class="btn btn-warning">Schreiben</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Scan-Bereich -->
        <section class="card">
            <h2>Bereich scannen</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="scan-start">Start-Adresse</label>
                    <input type="number" id="scan-start" value="0" min="0">
                </div>
                <div class="form-group">
                    <label for="scan-end">End-Adresse</label>
                    <input type="number" id="scan-end" value="10" min="0">
                </div>
                <div class="form-group">
                    <label for="scan-register-type">Register-Typ</label>
                    <select id="scan-register-type">
                        <option value="holding">Holding Register</option>
                        <option value="input">Input Register</option>
                        <option value="coil">Coil</option>
                        <option value="discrete">Discrete Input</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="scan-data-type">Datentyp</label>
                    <select id="scan-data-type">
                        {% for dt in data_types %}
                        <option value="{{ dt }}" {% if dt == 'uint16' %}selected{% endif %}>{{ dt }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <button id="btn-scan" class="btn btn-primary">Register scannen</button>

            <!-- Scan-Ergebnisse -->
            <div id="scan-results" class="scan-results hidden">
                <h3>Scan-Ergebnisse</h3>
                <table id="scan-table">
                    <thead>
                        <tr>
                            <th>Adresse</th>
                            <th>Wert</th>
                            <th>Roh</th>
                            <th>Status</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- Status-Meldungen -->
        <div id="status" class="status hidden"></div>
    </div>

    <script>
        // Hilfsfunktion für Status-Meldungen
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 5000);
        }

        // Hilfsfunktion für Verbindungseinstellungen
        function getConnectionSettings() {
            return {
                ip: document.getElementById('ip').value,
                port: parseInt(document.getElementById('port').value),
                slave_id: parseInt(document.getElementById('slave_id').value)
            };
        }

        // Einzelnes Register lesen
        document.getElementById('btn-read').addEventListener('click', async () => {
            const settings = getConnectionSettings();
            if (!settings.ip) {
                showStatus('Bitte IP-Adresse eingeben', 'error');
                return;
            }

            const data = {
                ...settings,
                address: parseInt(document.getElementById('address').value),
                data_type: document.getElementById('data_type').value,
                register_type: document.getElementById('register_type').value
            };

            showStatus('Lese Register...', 'info');

            try {
                const response = await fetch('/api/read', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('result-container').classList.remove('hidden');
                    document.getElementById('current-value').textContent = result.value;
                    document.getElementById('raw-value').textContent = JSON.stringify(result.raw);

                    const badge = document.getElementById('writable-badge');
                    badge.classList.remove('hidden');
                    if (result.writable) {
                        badge.textContent = 'Schreibbar';
                        badge.className = 'badge badge-success';
                        document.getElementById('write-section').classList.remove('hidden');
                    } else {
                        badge.textContent = 'Nur Lesen';
                        badge.className = 'badge badge-warning';
                        document.getElementById('write-section').classList.add('hidden');
                    }

                    showStatus('Erfolgreich gelesen', 'success');
                } else {
                    showStatus(result.error, 'error');
                }
            } catch (error) {
                showStatus(`Verbindungsfehler: ${error.message}`, 'error');
            }
        });

        // Testen ob schreibbar
        document.getElementById('btn-test-write').addEventListener('click', async () => {
            const settings = getConnectionSettings();
            if (!settings.ip) {
                showStatus('Bitte IP-Adresse eingeben', 'error');
                return;
            }

            const data = {
                ...settings,
                address: parseInt(document.getElementById('address').value),
                register_type: document.getElementById('register_type').value
            };

            showStatus('Teste ob Register schreibbar ist...', 'info');

            try {
                const response = await fetch('/api/test_write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    if (result.writable) {
                        showStatus(`Register ist SCHREIBBAR: ${result.reason}`, 'success');
                    } else {
                        showStatus(`Register ist NUR LESBAR: ${result.reason}`, 'warning');
                    }
                } else {
                    showStatus(result.error, 'error');
                }
            } catch (error) {
                showStatus(`Verbindungsfehler: ${error.message}`, 'error');
            }
        });

        // Wert schreiben
        document.getElementById('btn-write').addEventListener('click', async () => {
            const settings = getConnectionSettings();
            const newValue = document.getElementById('new-value').value;

            if (!newValue) {
                showStatus('Bitte einen Wert zum Schreiben eingeben', 'error');
                return;
            }

            const data = {
                ...settings,
                address: parseInt(document.getElementById('address').value),
                data_type: document.getElementById('data_type').value,
                register_type: document.getElementById('register_type').value,
                value: newValue
            };

            showStatus('Schreibe Wert...', 'info');

            try {
                const response = await fetch('/api/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showStatus('Wert erfolgreich geschrieben!', 'success');
                    // Erneut lesen zur Bestätigung
                    document.getElementById('btn-read').click();
                } else {
                    showStatus(result.error, 'error');
                }
            } catch (error) {
                showStatus(`Verbindungsfehler: ${error.message}`, 'error');
            }
        });

        // Register scannen
        document.getElementById('btn-scan').addEventListener('click', async () => {
            const settings = getConnectionSettings();
            if (!settings.ip) {
                showStatus('Bitte IP-Adresse eingeben', 'error');
                return;
            }

            const data = {
                ...settings,
                start_address: parseInt(document.getElementById('scan-start').value),
                end_address: parseInt(document.getElementById('scan-end').value),
                data_type: document.getElementById('scan-data-type').value,
                register_type: document.getElementById('scan-register-type').value
            };

            showStatus('Scanne Register...', 'info');

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    const tbody = document.querySelector('#scan-table tbody');
                    tbody.innerHTML = '';

                    result.results.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${item.address}</td>
                            <td>${item.value !== null ? item.value : '-'}</td>
                            <td>${item.raw ? JSON.stringify(item.raw) : '-'}</td>
                            <td>${item.error ? `<span class="error-text">${item.error}</span>` : '<span class="success-text">OK</span>'}</td>
                            <td>
                                ${item.value !== null ? `<button class="btn btn-small" onclick="loadToEditor(${item.address})">Bearbeiten</button>` : ''}
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('scan-results').classList.remove('hidden');
                    showStatus(`Scan abgeschlossen: ${result.results.length} Register`, 'success');
                } else {
                    showStatus(result.error, 'error');
                }
            } catch (error) {
                showStatus(`Verbindungsfehler: ${error.message}`, 'error');
            }
        });

        // Adresse in den Editor laden
        function loadToEditor(address) {
            document.getElementById('address').value = address;
            document.getElementById('register_type').value = document.getElementById('scan-register-type').value;
            document.getElementById('data_type').value = document.getElementById('scan-data-type').value;
            document.getElementById('btn-read').click();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Register-Typ Änderung - Datentyp-Optionen aktualisieren
        document.getElementById('register_type').addEventListener('change', (e) => {
            const dataTypeSelect = document.getElementById('data_type');
            if (e.target.value === 'coil' || e.target.value === 'discrete') {
                dataTypeSelect.innerHTML = '<option value="uint16">Boolean (0/1)</option>';
                dataTypeSelect.disabled = true;
            } else {
                dataTypeSelect.disabled = false;
                dataTypeSelect.innerHTML = `
                    {% for dt in data_types %}
                    <option value="{{ dt }}" {% if dt == 'uint16' %}selected{% endif %}>{{ dt }}</option>
                    {% endfor %}
                `;
            }
        });
    </script>
</body>
</html>
